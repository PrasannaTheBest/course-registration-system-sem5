name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: course-registration-war
          path: target/course-registration.war

      - name: Start the app (Jetty + embedded H2)
        run: |
          nohup mvn -B -Pdemo jetty:run > jetty.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/login > /dev/null; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "App did not start in time"; cat jetty.log; exit 1

      - name: End-to-end smoke test
        run: |
          mkdir -p evidence
          bash scripts/smoke-test.sh http://localhost:8080 | tee evidence/smoke-test.txt

      - name: Concurrency test (30 students, 10 seats)
        run: bash scripts/concurrency-test.sh http://localhost:8080 30 10 | tee evidence/concurrency-test.txt

      - name: Latency test
        run: bash scripts/perf-test.sh http://localhost:8080 200 | tee evidence/latency-test.txt

      - name: Capture screenshots
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm install playwright > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/pw/node_modules node scripts/screenshots.js http://localhost:8080 evidence/screenshots

      - name: Collect unit-test reports
        if: always()
        run: |
          mkdir -p evidence
          cp target/surefire-reports/*.txt evidence/ 2>/dev/null || true

      - name: Upload evidence (test output and screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/

      - name: Publish evidence to the ci-evidence branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: $(uname -sr), $(nproc) CPU cores, $(free -m | awk '/Mem:/{print $2}') MB RAM"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "maven: $(mvn -v 2>/dev/null | head -1)"
          } > evidence/meta.txt
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r evidence/. /tmp/pub/
          cd /tmp/pub
          git init -q -b ci-evidence
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "CI evidence for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-evidence

      - name: Show server log on failure
        if: failure()
        run: cat jetty.log || true
